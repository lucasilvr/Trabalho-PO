name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do codigo
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Instalar dependências
      run: pip install -r requirements.txt

    - name: Executar teste de domínio
      run: pytest src/biblioteca/*/tests/unit

    - name: Executar teste de integração
      run: pytest src/biblioteca/*/tests/integration

    - name: Executar teste estrutural
      run: pytest src/biblioteca/*/tests/e2e
